spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

app.storage.public-base-url=http://10.0.2.2:8080

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/dev-seed/seed_dev_data.sql
spring.jpa.defer-datasource-initialization=true

#app.storage.provider=${APP_STORAGE_PROVIDER:local}

sistema.admin.enabled=true

mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=app-local
mqtt.username=
mqtt.password=